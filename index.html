<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OhmLoom</title>
        <link rel="stylesheet" href="./css/main.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        />
        <script src="./js/toolbox.js" type="module" defer></script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
        </style>
    </head>
    <body>
        <div id="top-bar" class="floating-panel">
            <h4>OhmLoom</h4>
        </div>

        <main>
            <section class="workspace">
                <canvas id="scene"></canvas>
            </section>

            <aside id="toolbox" class="floating-panel">
                <div class="toolbox-group">
                    <h5>Power</h5>
                    <button id="battery">
                        <span class="material-symbols-outlined">electric_bolt</span>
                        Battery
                    </button>
                    <button id="ground">
                        <span class="material-symbols-outlined">south</span>
                        Ground
                    </button>
                </div>
                <div class="toolbox-group">
                    <h5>Passive</h5>
                    <button id="resistor">
                        <span class="material-symbols-outlined">rebase_edit</span>
                        Resistor
                    </button>
                    <button id="led">
                        <span class="material-symbols-outlined">lightbulb</span>
                        LED
                    </button>
                    <button id="capacitor">
                        <span class="material-symbols-outlined">format_overline</span>
                        Capacitor
                    </button>
                    <button id="polarized-capacitor">
                        <span class="material-symbols-outlined">format_underlined</span>
                        Polarized Cap
                    </button>
                </div>
            </aside>

            <div id="info" class="floating-panel">
                <div id="info-box">
                    <h4>Live Info</h4>
                    <div id="info-content"></div>
                </div>
                <div id="settings-box">
                    <h4 id="settings-title">Settings</h4>
                    <div id="settings-content"></div>
                </div>
            </div>

            <div id="action-dock" class="floating-panel">
                <div id="properties">
                    <select id="default-sets">
                        <option value="">Default Sets</option>
                        <option value="simple-led">Simple LED</option>
                        <option value="parallel-leds">Parallel LEDs</option>
                        <option value="rc-circuit">RC Circuit (Charging)</option>
                        <option value="voltage-divider">Voltage Divider</option>
                        <option value="capacitor-test">Capacitor Test</option>
                    </select>
                    <div class="action-buttons">
                        <button id="upload" title="Upload JSON">
                            <span class="material-symbols-outlined">upload</span>
                        </button>
                        <input type="file" id="file-input" style="display: none;" accept=".json">
                        <button id="delete" title="Clear Workspace">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                        <button id="download" title="Download JSON">
                            <span class="material-symbols-outlined">download</span>
                        </button>
                        <button id="run" title="Run Simulation">
                            <span class="material-symbols-outlined">play_arrow</span>
                            Run
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <script src="./js/app.js" type="module" defer></script>
    </body>
</html>
