<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OhmLoom</title>
        <link rel="stylesheet" href="./css/main.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        />
        <script src="./js/toolbox.js" type="module" defer></script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
        </style>
    </head>
    <body>
        <nav>
            <h4>OhmLoom</h4>
        </nav>
        <main>
            <aside>
                <div id="toolbox">
                    <div class="toolbox-group">
                        <h5>Power Sources</h5>
                        <button id="battery">Battery</button>
                        <button id="ground">Ground</button>
                    </div>
                    <div class="toolbox-group">
                        <h5>Passive Components</h5>
                        <button id="resistor">Resistor</button>
                        <button id="led">LED</button>
                        <button id="capacitor">Capacitor</button>
                        <button id="polarized-capacitor">Polarized Cap</button>
                    </div>
                </div>
                <div id="info">
                    <div id="info-box">
                        <h4>Live Info</h4>
                        <div id="info-content"></div>
                    </div>
                    <div>
                        <div id="settings-box">
                            <h4 id="settings-title">Settings</h4>
                            <div id="settings-content"></div>
                        </div>
                    </div>
                    <div id="properties">
                        <select id="default-sets" style="background: #222; color: white; border: 1px solid #444; padding: 6px; border-radius: 4px; outline: none; margin-right: 8px;">
                            <option value="">Default Sets</option>
                            <option value="simple-led">Simple LED</option>
                            <option value="voltage-divider">Voltage Divider</option>
                            <option value="capacitor-test">Capacitor Test</option>
                        </select>
                        <button id="upload">
                            <span class="material-symbols-outlined">
                                upload
                            </span>
                        </button>
                        <input type="file" id="file-input" style="display: none;" accept=".json">
                        <button id="delete">
                            <span class="material-symbols-outlined">
                                delete
                            </span>
                        </button>
                        <button id="download">
                            <span class="material-symbols-outlined">
                                download
                            </span>
                        </button>
                        <button id="run">
                            <span class="material-symbols-outlined">
                                play_arrow
                            </span>
                        </button>
                    </div>
                </div>
            </aside>
            <section class="workspace">
                <canvas id="scene"></canvas>
            </section>
        </main>
        <script src="./js/app.js" type="module" defer></script>
    </body>
</html>
